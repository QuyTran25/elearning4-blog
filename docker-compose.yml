services:
  mysql:
    image: mysql:8.0
    container_name: e4blog-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: e4-blog
      MYSQL_USER: e4user
      MYSQL_PASSWORD: password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./reset-database.sql:/docker-entrypoint-initdb.d/reset-database.sql
    networks:
      - e4blog-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  laravel:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: e4blog-laravel
    working_dir: /app
    environment:
      APP_NAME: e4-Blog
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: e4-blog
      DB_USERNAME: e4user
      DB_PASSWORD: password
      SANCTUM_STATEFUL_DOMAINS: localhost:3000,127.0.0.1:3000,localhost:5500,127.0.0.1:5500
      SESSION_DOMAIN: localhost
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/vendor
      - /app/node_modules
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - e4blog-network
    command: >
      sh -c "composer install &&
             php artisan key:generate &&
             php artisan config:clear &&
             php artisan cache:clear &&
             php artisan storage:link &&
             php artisan serve --host=0.0.0.0 --port=8000"

volumes:
  mysql_data:

networks:
  e4blog-network:
    driver: bridge
